version: "2.4"

services:
  sensmos-lora:
    image: ghcr.io/c-man-the-man/sensmos-lora:latest
    container_name: sensmos-lora
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
    network_mode: host
    cap_add:
      - NET_RAW
    environment:
      SENSMOS_STATE_DIR: /data/sensmos/lora
    volumes:
      - /data/sensmos/lora:/data/sensmos/lora
